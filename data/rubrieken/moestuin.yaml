  aftellen: []
  gebied: "heel Frankrijk"
  tekst: "Bonen kunnen de volle grond in na de laatste vorst, die per zone verschilt; tomaten worden op een beschutte plek uitgeplant, in de mediterrane zone vanaf eind april als de druppelirrigatie op orde is. De IJsheiligen (11 tot 13 mei) blijven de grens voor onbeschermde warmteminnaars in de continentale zone en de bergen."
