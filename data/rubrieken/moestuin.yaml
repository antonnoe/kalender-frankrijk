  wanneer: {regel: "jaarlijks 11-05 tot 13-05"}
  aftellen: [7, 1]
  gebied: "heel Frankrijk"
  tekst: "Mamert, Pancrace en Servais (11 tot 13 mei) markeren de laatste vorstgrens in de continentale zone en de bergen: pas daarna gaan tomaten, paprika's, aubergines, courgettes en basilicum onbeschermd de volle grond in. In de oceanische zones kan het vanaf half mei op een beschutte plek, in de mediterrane zone al vanaf eind april."
