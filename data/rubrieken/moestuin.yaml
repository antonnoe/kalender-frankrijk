  tekst: "In het noorden kleuren de tomaten en komen de eerste courgettes; in het zuiden is het overleven, met waterbeperkingen, mulchen en sla alleen onder schaduwdoek. Let op valse meeldauw bij vochtig weer, de coloradokever en de koolwitjes, en zaai nu al winterprei en elke vier weken bonen voor een doorlopende oogst."
