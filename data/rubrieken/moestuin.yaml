  aftellen: []
  gebied: "heel Frankrijk"
  tekst: "De eerste tomaten, paprika's en aubergines onder glas, in het zuiden al in de volle grond; druiven snoeien is het laatste moment voordat het sap omhoog stroomt. Het vorstrisico blijft tot de IJsheiligen half mei, dus koude bak en vlies klaarhouden."
