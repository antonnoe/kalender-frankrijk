  gebied: "heel Frankrijk"
  tekst: "Wat nu gezaaid wordt (winterwortelen, andijvie, veldsla, spinazie) oogst u in oktober en november. Vrijgekomen grond niet braak laten liggen maar groenbemesters zaaien (mosterd, phacelia, klaver, boekweit); in het noorden piekt de valse meeldauw, in de Provence is water geven de eerste zorg."
