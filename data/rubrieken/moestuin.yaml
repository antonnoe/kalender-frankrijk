  wanneer: {regel: "jaarlijks 01-01 tot 31-01"}
  aftellen: []
  gebied: "heel Frankrijk"
  tekst: "In de Midi gaan de eerste sla, schorseneren en doperwten al de volle grond in; in het noorden blijft het bij plannen, zaad bestellen en gereedschap onderhouden. Composthoop één keer omzetten en de wintersnoei van fruitbomen doorzetten op vorstvrije dagen."
